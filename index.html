<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fdfcf8">
    <meta name="description" content="纸间，一处慢慢读书的地方。">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <title>纸间 · 书架</title>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="toolbar">
      <div class="toolbar-inner">
        <a class="brand" href="#" id="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H3V4ZM21 4h-6a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h5V4Z"/></svg></span>纸间</a>
        <span class="toolbar-book" id="toolbar-book">慢慢读，读到哪就记到哪。</span>
        <div class="toolbar-actions">
          <button class="btn" id="shelf-button" type="button">书架</button>
          <button class="btn" id="toc-button" type="button" hidden>目录</button>
        </div>
      </div>
      <div class="status-strip" id="status-strip" aria-hidden="true"></div>
    </header>
    <main id="main" tabindex="-1">
      <section id="shelf-view" class="shelf-view" aria-labelledby="shelf-title">
        <div class="shelf-heading"><div class="kicker">BETWEEN THE PAGES</div><h1 id="shelf-title">书在这里，慢慢读。</h1><p>选一本，接着上次的位置读。</p></div>
        <div class="shelf-controls">
          <nav class="shelf-tabs" aria-label="书架来源"><button type="button" id="cloud-tab" aria-current="true">云端书架</button><button type="button" id="local-tab">本地书架</button></nav>
          <button class="btn" id="local-import" type="button" hidden>添加本地书籍</button>
        </div>
        <p id="shelf-status" class="shelf-note" role="status" hidden></p>
        <button class="text-button" id="cloud-retry" type="button" hidden>重试云端书架</button>
        <div id="shelf-grid" class="shelf-grid"></div>
        <p class="shelf-note" id="shelf-note">云端书籍由站长发布，阅读进度只保存在你的浏览器里。</p>
      </section>
      <section id="reader-view" class="layout" aria-label="阅读器" hidden>
        <div class="main-column">
          <div class="location"><span id="location-label"></span><span class="format" id="format-label"></span></div>
          <article class="paper" aria-labelledby="chapter-title">
            <div class="mast">FUHAO574 / READER <span id="mast-label"></span></div>
            <div class="chapter-head"><h1 id="chapter-title" tabindex="-1"></h1><div class="chapter-meta"><span id="chapter-index"></span><span id="chapter-size"></span></div></div>
            <div class="reading" id="reading"></div>
            <nav class="chapter-footer" aria-label="章节翻页"><button class="btn" id="prev" type="button">← 上一章</button><span class="middle">慢慢来，不用赶</span><button class="btn" id="next" type="button">下一章 →</button></nav>
          </article>
          <div class="save-line"><i class="save-dot" aria-hidden="true"></i><span id="save-state" role="status" aria-live="polite"></span></div>
        </div>
        <aside class="sidebar">
          <section class="side-card"><div class="side-kicker">ON THE DESK</div><div class="book-name" id="side-title"></div><div class="book-detail" id="book-detail"></div><div class="track"><i id="book-progress"></i></div><div class="progress-info"><span id="progress-label"></span><span id="chapter-label"></span></div></section>
          <section class="side-card"><div class="side-kicker">CONTENTS</div><h2>这一章之后</h2><nav class="toc" id="side-toc" aria-label="章节目录"></nav></section>
          <section class="side-card"><p class="side-note" id="reader-note"></p><button class="text-button" id="reset-progress" type="button">从头阅读这本书</button></section>
        </aside>
      </section>
      <section id="message-view" class="message-view" role="status" aria-live="polite" hidden><h1 id="message-title"></h1><p id="message-detail"></p><button class="btn" id="retry" type="button" hidden>重新加载</button></section>
    </main>
    <dialog id="toc-dialog" aria-labelledby="toc-title">
      <div class="dialog-head"><h2 id="toc-title">章节目录</h2><button class="btn icon-only" id="close-toc" type="button" aria-label="关闭目录">×</button></div>
      <form class="toc-search" id="toc-search-form" role="search">
        <label class="sr-only" for="toc-search">搜索章节标题</label>
        <input id="toc-search" type="search" placeholder="搜索章节标题…" autocomplete="off" aria-controls="modal-toc" aria-describedby="toc-search-status">
        <button class="btn" id="toc-search-clear" type="button" hidden>清空</button>
      </form>
      <p id="toc-search-status" class="toc-search-status" role="status" aria-live="polite"></p>
      <nav class="toc" id="modal-toc" aria-label="章节目录"></nav>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <input id="local-files" type="file" accept=".txt,.epub,text/plain,application/epub+zip" multiple hidden>
    <noscript><p>请开启 JavaScript 后阅读。书架与进度保存在浏览器中，不需要登录。</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
